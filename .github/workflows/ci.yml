name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: cd Safety-Robot/app/Ibn_Khaldoun_IoT_Safety_Robot/cloud-backend && npm install
      - name: Run tests
        run: cd Safety-Robot/app/Ibn_Khaldoun_IoT_Safety_Robot/cloud-backend && npm test
